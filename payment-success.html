<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment · SiteVoxa</title><link rel="icon" href="favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#174d3c 0,#09251d 35%,#04130f 100%);font-family:'DM Sans',sans-serif;color:#09251d}.card{width:min(560px,100%);padding:42px;border-radius:30px;background:#fff;box-shadow:0 40px 100px #0006;text-align:center}.mark{width:58px;height:58px;margin:auto;display:grid;place-items:center;border-radius:18px;background:#09251d;color:#c8f169;font:800 19px Manrope}.eyebrow{margin-top:24px;font-size:11px;font-weight:800;letter-spacing:.18em;color:#648077}h1{margin:9px 0 12px;font:800 34px/1.1 Manrope}p{color:#687a73;line-height:1.6}.spinner{width:30px;height:30px;margin:24px auto;border:3px solid #dce6e2;border-top-color:#0b684d;border-radius:50%;animation:spin .8s linear infinite}.actions{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}.actions a{padding:13px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;background:#0b684d;color:white}.actions a.secondary{background:#eef3f0;color:#09251d}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:520px){.card{padding:30px 20px}h1{font-size:28px}}</style></head><body><main class="card"><div class="mark">SV</div><div class="eyebrow">SECURE CHECKOUT</div><h1 id="title">Confirming your payment</h1><div class="spinner" id="spinner"></div><p id="message">SiteVoxa is verifying the transaction with the backend before activating your workspace.</p><div class="actions" id="actions" hidden><a href="https://sitevoxa-app.onrender.com/">Continue to workspace</a><a class="secondary" href="./#pricing">Back to pricing</a></div></main><script>const API='https://sitevoxa.onrender.com';const q=new URLSearchParams(location.search);const ref=q.get('reference')||q.get('trxref');const token=sessionStorage.getItem('sitevoxa-checkout-token');const title=document.querySelector('#title'),message=document.querySelector('#message'),spinner=document.querySelector('#spinner'),actions=document.querySelector('#actions');async function run(){if(!ref){title.textContent='Payment reference missing';message.textContent='Paystack did not return a transaction reference.';spinner.hidden=true;actions.hidden=false;return}if(!token){title.textContent='Payment received';message.textContent='Sign in to your SiteVoxa workspace to view your subscription status. The backend will still process a valid Paystack webhook.';spinner.hidden=true;actions.hidden=false;return}try{const r=await fetch(API+'/api/payments/verify/'+encodeURIComponent(ref),{headers:{Authorization:'Bearer '+token}});const b=await r.json();if(r.ok&&b?.payment?.status==='successful'){title.textContent='Welcome to SiteVoxa';message.textContent='Payment verified. Your subscription is active and your workspace is ready.';sessionStorage.removeItem('sitevoxa-checkout-token')}else{title.textContent='Payment is being confirmed';message.textContent=b?.message||'The transaction has not been confirmed yet. Your workspace will update after verification.'}}catch{title.textContent='Verification delayed';message.textContent='We could not reach SiteVoxa right now. A valid Paystack webhook can still activate your subscription.'}spinner.hidden=true;actions.hidden=false}run();</script></body></html>
